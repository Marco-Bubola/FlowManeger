; Configuração do robô de imagens. Dá para mudar tudo pela janela do robô (botão de engrenagem).
; Linhas que começam com ; são comentários.

[robo]
; Pasta onde ficam as imagens dos produtos
pasta_imagens = E:\eudora\Produtos Eudora

; Seu site
site_app = https://flowmaneger.com

; Site de revendedores do Grupo Boticário
site_revendedor = https://revendedores.grupoboticario.com.br

; Página de pesquisa de produtos de quem já está logado (a página inicial do site é a de cadastro)
pagina_busca = https://revendedores.grupoboticario.com.br/departamentos

; sim = quando não achar na pasta, procura no site de revendedores
usar_site_revendedor = sim

; sim = procura foto e código de barras no catálogo público das lojas do grupo
usar_lojas_publicas = sim
lojas_publicas = https://www.boticario.com.br | https://www.eudora.com.br | https://www.quemdisseberenice.com.br | https://www.oui.com.br

; sim = se o robô não achar a foto no site sozinho, ele pede para você
; clicar na foto (segurando ALT). nao = pula o produto.
modo_assistido = sim

; Navegador que o robô usa: chrome, msedge ou playwright
navegador = chrome

; Amostras/flaconetes que você NÃO quer cadastrar (outros brindes continuam). Começo do nome ou palavra, separados por |
pular_produtos = CJ SCH | CJ FLAC | DEM | DEMONSTRADOR | AMOSTRA | FLACONETE | SACHE

; sim = tira esses produtos da tela (botão Remover) para não serem salvos
remover_amostras = sim

; sim = preenche o código de barras (EAN) de cada produto que estiver vazio
preencher_codigo_barras = sim

; Quanto o nome precisa ser parecido (0 a 100) para usar uma imagem da pasta
similaridade_minima = 90

; Segundos de pausa entre uma busca e outra no site (não diminua muito)
pausa_entre_buscas = 3

[janela]
tema = aurora

[seletores]
; Deixe em branco: o robô descobre sozinho.
; Só preencha se o robô não achar algo no site de revendedores.
; Pode colocar vários separados por |
campo_busca =
primeiro_resultado =
imagem_produto =
; Se o site tiver um endereço de busca, ex: https://revendedores.grupoboticario.com.br/busca?q={codigo}
url_busca =
