[robo]
; Endereço do FlowManeger
site = https://flowmaneger.com
; Uma pasta por produto (ficha.md + fotos). Vazio = a pasta "produtos" ao lado do robô
pasta_produtos =
; Depois de cadastrar, move a pasta do produto para produtos\feitos
mover_feitos = sim
; Mostra o navegador enquanto cadastra (precisa na primeira vez, para fazer o login)
navegador_visivel = sim
; Fotos maiores que isso são reduzidas antes de subir
lado_maximo_foto = 1600
tamanho_maximo_foto_kb = 1500
pausa_entre_produtos = 1
